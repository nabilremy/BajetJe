<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BajetJe · Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink-50:#f7f7f6;--ink-300:#bcbcb9;--ink-400:#949491;--ink-500:#6f6f6c;--ink-600:#545451;
  --ink-700:#3d3d3b;--ink-800:#2a2a28;--ink-900:#1e1e1e;--ink-950:#141414;
  --lime:#c5ff73;--amber:#ffbb33;--coral:#ff775c;
  --ease:cubic-bezier(0.23,1,0.32,1);--spring:cubic-bezier(0.34,1.56,0.64,1);
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
/* Duit is a dark product; tokens are the same in every viewer theme */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink-900:#1e1e1e}}
:root[data-theme="dark"]{--ink-900:#1e1e1e}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;background:var(--ink-950);color:var(--ink-50);font-family:var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.stage{height:100%;display:flex;align-items:center;justify-content:center;padding:16px}
.phone{position:relative;width:min(100%,400px);height:min(calc(100% - 40px),860px);background:var(--ink-900);border-radius:36px;overflow:hidden;box-shadow:0 0 0 1px #2c2c2c,0 30px 80px rgba(0,0,0,.45)}
@media (max-width:520px){.stage{padding:0;gap:0}.phone{width:100%;height:100%;border-radius:0;box-shadow:none}}

/* Screens */
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:56px 20px 0;display:none;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen.active{display:block}
.screen.in-fwd{animation:in-fwd 280ms var(--ease) both}
.screen.in-back{animation:in-back 280ms var(--ease) both}
@keyframes in-fwd{from{transform:translateX(28px);opacity:0}to{transform:none;opacity:1}}
@keyframes in-back{from{transform:translateX(-28px);opacity:0}to{transform:none;opacity:1}}
.stack{display:flex;flex-direction:column;gap:24px;padding-bottom:28px}

/* Type */
.over{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-500)}
.h1{font-size:24px;line-height:30px;font-weight:600;letter-spacing:-.01em}
.h2{font-size:20px;line-height:26px;font-weight:600}
.h3{font-size:17px;line-height:24px;font-weight:600}
.body{font-size:13px;line-height:20px;color:var(--ink-400)}
.cap{font-size:12px;line-height:16px;color:var(--ink-500)}
.lbl{font-size:13px;font-weight:500}
.muted{color:var(--ink-500)}.soft{color:var(--ink-400)}.lime{color:var(--lime)}.amber{color:var(--amber)}.coral{color:var(--coral)}

/* Building blocks */
.row{display:flex;align-items:center;gap:8px}.grow{flex:1;min-width:0}.between{justify-content:space-between}
.card{background:var(--ink-800);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.section{display:flex;flex-direction:column;gap:14px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border-radius:14px;font-size:15px;font-weight:500;transition:transform 120ms var(--ease),opacity 150ms}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--lime);color:var(--ink-900)}
.btn-primary:disabled{opacity:.35;pointer-events:none}
.btn-quiet{background:var(--ink-700);color:var(--ink-50)}
.link{font-size:13px;font-weight:500;color:var(--ink-50);padding:12px 0;margin:-12px 0;display:inline-flex;align-items:center;gap:4px;transition:transform 120ms var(--ease),opacity 120ms ease}
.link:active{transform:scale(.96)}
.link:active{opacity:.7}
.iconbtn{width:36px;height:36px;border-radius:999px;background:var(--ink-800);display:grid;place-items:center;flex:none;transition:transform 120ms var(--ease)}
.iconbtn:active{transform:scale(.94)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--ink-800);font-size:12px;color:var(--ink-400);transition:transform 120ms var(--ease),background-color 200ms ease,color 200ms ease}
button.chip:active,label.chip:active{transform:scale(.94)}
.chip.just{animation:sel-pop 340ms var(--spring) both}
@keyframes sel-pop{from{transform:scale(.88)}to{transform:none}}
.tgl{position:relative;flex:none;width:46px;height:28px;border-radius:999px;background:var(--ink-700);transition:background-color 220ms ease,transform 120ms var(--ease)}
.tgl[aria-checked="true"]{background:var(--lime)}
.tgl:active{transform:scale(.94)}
.tgl i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:999px;background:var(--ink-50);transform:translateX(calc(var(--i,0) * 18px));transition:transform 260ms var(--spring)}
.tgl[aria-checked="true"] i{background:var(--ink-900)}
.chip b{font-family:var(--mono);font-weight:400;color:var(--ink-50);font-size:13px}
.seg{position:relative;display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--ink-800)}
.seg::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 12px) / 2);border-radius:9px;background:var(--ink-700);transform:translateX(calc(var(--i,0) * (100% + 4px)));transition:transform 260ms var(--ease)}
.seg button{position:relative;z-index:1;flex:1;padding:10px 0;border-radius:9px;font-size:13px;font-weight:500;color:var(--ink-400);transition:color 180ms ease,transform 120ms var(--ease)}
.seg button:active{transform:scale(.96)}
.seg button[aria-pressed="true"]{color:var(--ink-50)}
.hr{height:1px;background:var(--ink-700)}
.sticky{position:sticky;bottom:0;margin:0 -20px;padding:16px 20px calc(20px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,rgba(30,30,30,0),var(--ink-900) 22%);display:flex;flex-direction:column;gap:12px}
.splash{position:absolute;inset:0;z-index:60;background:var(--ink-900);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transition:opacity 300ms ease}
.splash.out{opacity:0;pointer-events:none}
.splash svg{width:132px;height:132px;overflow:visible}
.splash .sg-body{animation:sp-rise 400ms var(--ease) 50ms both}
.splash .sg-head{animation:sp-rise 400ms var(--ease) 120ms both}
.splash .sg-coin{transform-box:fill-box;transform-origin:50% 50%;animation:coin-pop 520ms var(--spring) 350ms both}
.splash .sg-arm{animation:sp-fade 200ms ease-out 450ms both}
.splash .sk-line{transform-box:fill-box;transform-origin:50% 50%;animation:sk-in 420ms var(--ease) 50ms both}
.splash .sk-wipe{animation:sk-wipe 650ms var(--ease) 380ms both}
@keyframes sk-in{from{opacity:0;transform:scale(.94) rotate(-2deg)}}
@keyframes sk-wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes coin-pop{from{opacity:0;transform:scale(.6) rotate(-25deg)}to{opacity:1;transform:none}}
.sp-word{font-size:40px;font-weight:600;letter-spacing:-.02em;color:#eaffcc;animation:sp-rise 350ms var(--ease) 550ms both}
.sp-word b{font-weight:600;color:#c5ff73}
.sp-tag{font-size:15px;color:var(--ink-500);animation:sp-fade 300ms ease-out 750ms both}
.sp-priv{position:absolute;bottom:calc(52px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:6px;font-size:12px;color:#93db2e;animation:sp-fade 300ms ease-out 900ms both}
.sp-priv .svg-i{color:var(--ink-50)}
@keyframes sp-rise{from{opacity:0;transform:translateY(12px)}}
@keyframes sp-fade{from{opacity:0}}
.welcome .doodle{align-self:center;width:100%;max-width:330px}
.doodle-svg .ch{transform-box:fill-box;transform-origin:50% 100%;animation:bob 3.2s ease-in-out infinite}
.doodle-svg .ch2{animation-duration:3.6s;animation-delay:-1.2s}
.doodle-svg .ch3{animation-duration:3.4s;animation-delay:-.6s}
.doodle-svg .bubble{transform-box:fill-box;transform-origin:50% 100%;animation:pop 420ms var(--spring) 300ms both,float 3s ease-in-out 900ms infinite}
.doodle-svg .b3{animation-delay:500ms,1100ms}
.doodle-svg .q{transform-box:fill-box;transform-origin:50% 100%;animation:wiggle 2.4s ease-in-out 800ms infinite}
.doodle-svg .eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4.6s linear infinite}
.doodle-svg .ch2 .eyes{animation-delay:1.5s}.doodle-svg .ch3 .eyes{animation-delay:3s}
.doodle-svg .coin{transform-box:fill-box;animation:drop 600ms var(--ease) 900ms both}
.doodle-svg .pie{transform-box:fill-box;transform-origin:50% 50%;animation:spin-in 700ms var(--ease) 500ms both}
.doodle-svg .spark{animation:twinkle 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:none}50%{transform:translateY(-3px)}}
@keyframes float{0%,100%{transform:none}50%{transform:translateY(-4px)}}
@keyframes wiggle{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes blink{0%,93%,100%{transform:none}96%{transform:scaleY(.1)}}
@keyframes drop{from{transform:translateY(-26px);opacity:0}50%{opacity:1}to{transform:none;opacity:1}}
@keyframes spin-in{from{transform:rotate(-120deg);opacity:0}to{transform:none;opacity:1}}
@keyframes twinkle{0%,100%{opacity:.35}50%{opacity:1}}
.disclaimer{display:flex;gap:12px;align-items:flex-start;background:var(--ink-800);border-radius:12px;padding:14px}
.lang{display:flex;gap:2px;padding:2px;border-radius:999px;background:var(--ink-800)}
.lang{position:relative}
.lang::before{content:"";position:absolute;top:2px;left:2px;width:40px;height:32px;border-radius:999px;background:var(--ink-700);transform:translateX(calc(var(--i,0) * 42px));transition:transform 260ms var(--ease)}
.lang button{position:relative;z-index:1;min-width:40px;height:32px;border-radius:999px;font-size:12px;font-weight:600;color:var(--ink-500);transition:color 180ms ease,transform 120ms var(--ease)}
.lang button:active{transform:scale(.92)}
.lang button[aria-pressed="true"]{color:var(--ink-50)}
.react{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;padding:5px 10px;border-radius:999px;background:var(--ink-800);color:var(--ink-300);font-size:13px;font-weight:500;animation:pop 420ms var(--spring) 200ms both}
.react .svg-i{width:14px;height:14px;color:var(--lime)}
.cta-wrap{position:relative;display:flex;flex-direction:column}
.cta-wrap .btn{position:relative;z-index:2}
.btn .spin{width:20px;height:20px;margin-right:8px;flex:none}
.btn.loading{pointer-events:none}
.btn.loading .spin{animation:spin 900ms linear infinite}
.btn.loading>span{animation:swap-in 160ms var(--ease) both}
@keyframes spin{to{transform:rotate(360deg)}}
.note{position:absolute;right:18px;bottom:calc(100% + 6px);z-index:1;display:flex;align-items:flex-end;gap:2px;font-family:"Caveat",var(--sans);font-weight:700;font-size:26px;line-height:1.1;color:var(--ink-50);white-space:nowrap;text-shadow:0 1px 0 var(--ink-900);pointer-events:none;transform-origin:70% 100%}
.note svg{width:40px;height:30px;color:var(--ink-50);margin-bottom:-14px}
.note.show{animation:note-up 520ms var(--spring) 120ms both}
@keyframes note-up{from{opacity:0;transform:translateY(46px) scale(.9)}to{opacity:1;transform:translateY(0) rotate(-6deg)}}
.tipwrap{position:relative}
.tip{position:absolute;left:0;right:0;top:calc(100% + 10px);z-index:5;background:var(--ink-700);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 32px rgba(0,0,0,.45);transform-origin:var(--ax,24px) top;animation:tip-in 160ms var(--ease) both}
.tip::before{content:"";position:absolute;top:-6px;left:calc(var(--ax,24px) - 6px);width:12px;height:12px;background:var(--ink-700);transform:rotate(45deg);border-radius:2px}
.tip .eq{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:12px;color:var(--ink-300)}
.tip .eq b{font-family:var(--mono);font-weight:400;color:var(--ink-50);text-align:right}
.tip .eq .tot{border-top:1px solid var(--ink-600);padding-top:6px;color:var(--ink-50);font-weight:500}
.tip[hidden],[hidden]{display:none!important}
@keyframes tip-in{from{opacity:0;transform:translateY(-4px) scale(.96)}}
.chip[aria-expanded="true"]{background:var(--ink-700)}
.chip .svg-i{width:14px;height:14px;color:var(--ink-500)}
.swipe{position:relative;border-radius:12px;overflow:hidden;background:var(--coral)}
.sw-del{position:absolute;right:0;top:0;bottom:0;width:84px;display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--ink-900)}
.sw-fg{position:relative;transition:transform 220ms var(--ease);touch-action:pan-y;will-change:transform;border-radius:0}
.minus{width:24px;height:24px;border-radius:99px;background:var(--coral);display:grid;place-items:center;flex:none;transition:transform 120ms var(--ease)}
.minus:active{transform:scale(.9)}
.minus i{width:10px;height:2px;border-radius:1px;background:var(--ink-900)}
.vt{display:flex;gap:2px;padding:2px;border-radius:10px;background:var(--ink-800)}
.vt{position:relative}
.vt::before{content:"";position:absolute;top:2px;left:2px;width:36px;height:32px;border-radius:8px;background:var(--ink-700);transform:translateX(calc(var(--i,0) * 38px));transition:transform 240ms var(--ease)}
.vt button{position:relative;z-index:1;width:36px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink-500);transition:color 150ms ease,transform 120ms var(--ease)}
.vt button:active{transform:scale(.92)}
.vt button[aria-pressed="true"]{color:var(--ink-50)}
.split-body{display:flex;flex-direction:column;gap:14px;overflow:hidden}
.split-body.swap>*{animation:swap-in 220ms var(--ease) both}
.split-body.swap>*+*{animation-delay:40ms}
.split-body.swap .grow-x{animation:grow-x 380ms var(--ease) both;animation-delay:calc(60ms + var(--i,0) * 50ms)}
.split-body.swap .grow-y{animation:grow-y 420ms var(--ease) both;animation-delay:calc(60ms + var(--i,0) * 50ms)}
.split-body.swap .grow-r{animation:swap-in 260ms var(--ease) both;animation-delay:calc(var(--i,0) * 50ms)}
@keyframes swap-in{from{opacity:0;transform:translateY(6px)}}
.toast{position:absolute;left:16px;right:16px;bottom:calc(112px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink-700);border-radius:12px;padding:10px 10px 10px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 12px 32px rgba(0,0,0,.45);animation:rise 200ms var(--ease) both;font-size:13px}
.svg-i .dd,svg .dd{stroke:none}
.svg-i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* Hero numbers */
.hero{font-family:var(--mono);font-weight:700;font-size:64px;line-height:72px;letter-spacing:-.03em}
.hero-md{font-family:var(--mono);font-weight:700;font-size:48px;line-height:56px;letter-spacing:-.03em}

/* Digit roll */
.roll{display:inline-flex;overflow:hidden;padding:.08em 0;line-height:1;vertical-align:bottom}
.roll>span{display:inline-block}
.roll>.in{animation:digit-in 180ms var(--ease) both}
@keyframes digit-in{from{transform:translateY(.6em);opacity:0}66%{opacity:1}to{transform:none;opacity:1}}

/* Fields */
.field{position:relative;display:flex;align-items:center;gap:8px;height:64px;padding:0 16px;border-radius:12px;background:var(--ink-800);box-shadow:inset 0 0 0 1px var(--ink-700);transition:box-shadow 150ms var(--ease)}
.field:focus-within{box-shadow:inset 0 0 0 1.5px var(--lime)}
.field .cur{color:var(--ink-500);font-size:15px;font-weight:500}
.field .val{position:relative;flex:1;font-family:var(--mono);font-weight:700;font-size:28px;height:36px;display:flex;align-items:center}
.field .val input{position:absolute;inset:0;width:100%;background:transparent;border:0;outline:0;color:transparent;caret-color:var(--lime);font-family:var(--mono);font-weight:700;font-size:28px;letter-spacing:0}
.field .val input::placeholder{color:var(--ink-700)}
.amt{display:flex;align-items:baseline;gap:4px}
.amt input{width:76px;text-align:right;background:transparent;border:0;outline:0;font-family:var(--mono);font-size:15px;color:var(--ink-50);padding:10px 0;border-bottom:1px dashed transparent;transition:border-color 150ms}
.amt input:focus{border-bottom-color:var(--lime)}

/* Meters */
.track{position:relative;height:8px;border-radius:4px;background:var(--ink-700);overflow:hidden}
.track>i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;transform-origin:left}
.zones{position:relative;height:10px;display:flex;gap:2px}
.zones>i{border-radius:3px;opacity:.4}
.marker{position:absolute;inset:-5px 0;pointer-events:none}
.marker>b{position:absolute;left:0;top:0;bottom:0;width:100%;transform:translateX(var(--p));}
.marker>b::before{content:"";position:absolute;left:-2px;top:0;width:4px;height:20px;border-radius:2px;background:var(--ink-50)}
.marker.sweep>b{animation:sweep 650ms var(--ease) 300ms both}
@keyframes sweep{from{transform:translateX(0)}}

/* Reveal choreography (hub, once per session) */
.reveal [data-r]{animation:rise 400ms var(--ease) both;animation-delay:calc(var(--i,0) * 60ms)}
@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.reveal .grow-x{animation:grow-x 450ms var(--ease) both;animation-delay:calc(180ms + var(--i,0) * 60ms)}
@keyframes grow-x{from{transform:scaleX(0)}}
.reveal .grow-y{animation:grow-y 450ms var(--ease) both;animation-delay:calc(180ms + var(--i,0) * 60ms)}
@keyframes grow-y{from{transform:scaleY(0)}}
.reveal .today{animation:today 520ms var(--spring) 300ms both}
@keyframes today{from{transform:scaleY(.4)}}
.pop{animation:pop 420ms var(--spring) 250ms both}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}

/* Month strip */
.strip{position:relative;display:flex;align-items:flex-end;gap:3px;height:52px;padding-top:20px}
.strip i{flex:1;height:20px;border-radius:2px;background:var(--ink-700);transform-origin:bottom}
.strip i.f{background:var(--amber);opacity:.55}
.strip i.t{height:32px;background:var(--lime);opacity:1}
.strip .tl{position:absolute;top:0;font-size:13px;font-weight:500;color:var(--lime);transform:translateX(-50%)}

/* Lists */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 12px;border-radius:12px;background:var(--ink-800)}
.ico{width:34px;height:34px;border-radius:9px;background:var(--ink-700);display:grid;place-items:center;flex:none}
.tag{font-size:11px;padding:0 6px;border-radius:999px;background:var(--coral);color:var(--ink-900);font-weight:500}
.add{border:1px dashed var(--ink-600);background:transparent;justify-content:center;color:var(--ink-50);font-size:13px;font-weight:500;min-height:48px}
.legend{display:flex;flex-direction:column;gap:8px}
.legend .row{font-size:12px}
.sw{width:8px;height:8px;border-radius:2px;flex:none}
.wf{display:flex;flex-direction:column;gap:12px}
.wf .bar{position:relative;height:8px}
.wf .bar i{position:absolute;top:0;bottom:0;border-radius:3px}

/* Variant: Jars */
.jars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.jar{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.jar .glass{position:relative;height:150px;border-radius:14px 14px 18px 18px;background:var(--ink-800);box-shadow:inset 0 0 0 1px var(--ink-700);overflow:hidden}
.jar .glass i{position:absolute;left:0;right:0;bottom:0;transform-origin:bottom;border-radius:0 0 18px 18px}
.jar .glass span{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-family:var(--mono);font-size:13px;font-weight:500;color:var(--ink-900)}
/* Variant: Ledger */
.ledger>div{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:14px 0;border-top:1px solid var(--ink-700)}
.ledger>div:first-child{border-top:0;padding-top:0}
.ledger .big{font-family:var(--mono);font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:34px}

@media (prefers-reduced-motion: reduce){
  .seg::before,.lang::before,.tgl i{transition:none!important}
  .chip.just{animation:none!important}
  .btn.loading .spin{animation:none!important}
  .note.show{animation:none!important;transform:rotate(-6deg)}
  .doodle-svg *{animation:none!important}
  .splash .sk-line,.splash .sk-wipe,.sp-word,.sp-tag,.sp-priv{animation:none!important}
  *,*::before,*::after{animation-duration:150ms!important;animation-delay:0ms!important;transition-duration:0ms!important}

/* ================= Calculation engine ================= */
const bracketMid = g => Math.min(Math.floor((g - 0.01) / 100) * 100 + 50, 5950);
function payroll(gross){
  if (!gross) return {epf:0,socso:0,eis:0,pcb:0,net:0};
  const epf = Math.ceil(gross * S_epf());
  const mid = gross > 6000 ? 5950 : bracketMid(gross);
  const socso = +(mid * 0.005).toFixed(2), eis = +(mid * 0.002).toFixed(2);
  const ci = Math.max(0, gross*12 - Math.min(epf*12, 4000) - 9000 - Math.min((socso+eis)*12, 350));
  const B = [[5000,0],[20000,.01],[35000,.03],[50000,.06],[70000,.11],[100000,.19],[400000,.25],[600000,.26],[2000000,.28],[Infinity,.30]];
  let tax=0, lo=0; for (const [hi,r] of B){ if (ci>lo) tax += (Math.min(ci,hi)-lo)*r; lo=hi; }
  if (ci <= 35000) tax = Math.max(0, tax - 400);
  const pcb = +(tax/12).toFixed(2);
  return {epf, socso, eis, pcb, net: gross - epf - socso - eis - pcb};
}
function S_epf(){ return 0.11; }
const DAY = 86400000;
function payDate(y, m, pd){ const last = new Date(y, m+1, 0).getDate(); return new Date(y, m, pd==='last' ? last : Math.min(+pd, last)); }
function cycle(pd){
  const n = new Date(), t = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  const here = payDate(t.getFullYear(), t.getMonth(), pd || 'last');
  const [prev, next] = t >= here ? [here, payDate(t.getFullYear(), t.getMonth()+1, pd || 'last')] : [payDate(t.getFullYear(), t.getMonth()-1, pd || 'last'), here];
  return {prev, next, days: Math.round((next-prev)/DAY), idx: Math.round((t-prev)/DAY)+1, left: Math.round((next-t)/DAY)};
}
const fmtD = d => d.getDate()+' '+d.toLocaleString('en-MY',{month:'short'});
function calc(){
  const raw = +S.raw || 0;
  const p = S.mode === 'gross' ? payroll(raw) : {epf:0,socso:0,eis:0,pcb:0,net:raw};
  const net = Math.round(p.net);
  const cy = cycle(S.payday), days = cy.days, today = cy.idx, daysLeft = cy.left;
  const needs = Math.round(net*.5), wants = Math.round(net*.3), savings = net - needs - wants;
  const sumB = b => S.commitments.filter(c=>c.bucket===b).reduce((a,c)=>a+(+c.amt||0),0);
  const needsC = sumB('needs'), wantsC = sumB('wants'), savC = sumB('savings');
  const commit = needsC + wantsC;
  const savingsOut = Math.max(savings, savC);
  const debt = S.commitments.filter(c=>c.debt).reduce((a,c)=>a+(+c.amt||0),0);
  const ratio = net ? commit/net*100 : 0;
  const left = net - commit - savingsOut;
  const daily = Math.max(0, Math.floor(commit + savC ? left/days : wants/days));
  return {...p, raw, net, days, today, daysLeft, needs, wants, savings, savingsOut, needsC, wantsC, savC, commit, debt, ratio, debtRatio: net? debt/net*100:0, left, daily, cy};
}
// Car: 9 yrs, ~3% flat. Down payment 0% (graduate full-loan schemes) to 30%.
const coef = (dp = S.carDown) => (1-dp)*1.27/108 + 0.025/12;   // instalment + insurance per RM of price
const carAllIn = (price, dp = S.carDown) => {
  const inst = price*(1-dp)*1.27/108, ins = price*0.025/12 + 20;
  return {inst, petrol:150, ins, service:50, total: inst + 150 + ins + 50, down: price*dp};
};
const carLimit = (net, share, dp = S.carDown) => Math.max(0, (net*share - 220) / coef(dp));
// Home: instalment capped at 30% of take-home, 35 yrs. 0% down needs a first-home scheme (SRP / SJKP, price up to RM 500k).
function home(net, savings, rate, dp = S.homeDown){
  const r = rate/100/12, n = 420, inst = net*0.30;
  const loan = inst * (1 - Math.pow(1+r,-n)) / r;
  let price = loan/(1-dp); const capped = dp===0 && price > 500000; if (capped) price = 500000;
  const dep = price*dp;
  return {inst, loan: price*(1-dp), price, dep, capped, months: dep===0 ? 0 : savings ? Math.ceil(dep/savings) : Infinity};
}
// Indicative first-home 100% financing check (SRP: gross <= RM 5k single, age 21-40; SJKP: income <= RM 11k, 18+). Banks decide.
function eligibility(){
  const e = S.elig, g = S.mode==='gross' ? (+S.raw||0) : null;
  if ([e.first,e.citizen,e.age].some(v=>v===null)) return {state:'pending'};
  if (!e.first) return {state:'no', why:'100% financing is only for your first home.'};
  if (!e.citizen) return {state:'no', why:'First-home schemes are for Malaysian citizens only.'};
  const schemes = [];
  if (e.age && g!==null && g <= 5000) schemes.push('Skim Rumah Pertamaku');
  if (g===null || g <= 11000) schemes.push('SJKP');
  if (!schemes.length) return {state:'no', why:'Your income is above the RM 11,000 limit for SJKP.'};
  return {state:'yes', schemes, note: g===null ? 'Income checked against take-home; your gross decides.' : ''};
}

}

/* Digit roll: animates only new/changed characters. anchor 'start' while typing, 'end' for totals */
function roll(el, text, anchor='start', stagger=0){
  if (!el) return;
  const chars = [...text], total = chars.filter(c=>/\d/.test(c)).length;
  let seen = 0;
  const slots = chars.map(ch => { const d = /\d/.test(ch); if (d) seen++; const pos = anchor==='start' ? seen : total - seen + (d?1:0); return {ch, slot:(d?'d':'s')+pos}; });
  const prev = el._prev; let order = 0;
  el.setAttribute('aria-label', text);
  el.innerHTML = slots.map(({ch,slot}) => {
    const isNew = prev && prev.get(slot) !== ch;
    const d = isNew && stagger ? `style="animation-delay:${order++*stagger}ms"` : '';
    return `<span aria-hidden="true" class="${isNew?'in':''}" ${d}>${ch}</span>`;
  }).join('');
  el._prev = new Map(slots.map(s=>[s.slot,s.ch]));
}

function trText(t){ const k=t.trim(); if (!k || !/[A-Za-z]/.test(k)) return null; if (BM[k] && BM[k]!==k) return t.replace(k,BM[k]);
  for (const [re,f] of BMR){ const m=k.match(re); if (m){ const r=f(...m); return r!==k ? t.replace(k,r) : null; } } return null; }
function trNode(root){
  if (S.lang!=='ms' || !root) return;
  if (root.nodeType===3){ const r=trText(root.nodeValue); if (r!=null) root.nodeValue=r; return; }
  if (root.nodeType!==1) return;
  const tw=document.createTreeWalker(root, NodeFilter.SHOW_TEXT); const list=[]; let n; while((n=tw.nextNode())) list.push(n);
  list.forEach(x=>{ if (x.parentElement && (x.parentElement.closest('.roll'))) return; const r=trText(x.nodeValue); if (r!=null) x.nodeValue=r; });
  [root, ...root.querySelectorAll('[aria-label],[placeholder],[title]')].forEach(e=>{ if(!e.getAttribute) return; ['aria-label','placeholder','title'].forEach(a=>{ const v=e.getAttribute(a); if(v){ const r=trText(v); if(r!=null) e.setAttribute(a,r); } }); });
}

const screens = {};
let stack = [];
let revealed = false;
function go(name, dir='fwd'){
  if (dir==='fwd') stack.push(name); else if (dir==='back') { stack.pop(); if (!stack.length) stack=[name]; }
  else stack=[name];
  Object.values(screens).forEach(s=>s.classList.remove('active','in-fwd','in-back'));
  let el = screens[name];
  if (!el){ el = document.createElement('section'); el.className='screen'; el.dataset.screen=name; app.appendChild(el); screens[name]=el; }
  render(name);
  el.scrollTop = 0;
  el.classList.add('active', dir==='back' ? 'in-back' : 'in-fwd');
}
const back = () => { const prev = stack[stack.length-2] || 'plan'; go(prev,'back'); };
function render(name){ const el = screens[name]; ({welcome:rWelcome, salary:rSalary, plan:rPlan, commit:rCommit, health:rHealth, car:rCar, house:rHouse})[name](el); }

  el.innerHTML = `<div class="stack" style="min-height:100%">
    <div class="section" style="gap:10px">

}

function splitCard(c){
  const vi = Math.max(0, VIEWS.findIndex(v=>v[0]===S.variant));
  const head = `<div class="row between"><div class="row" style="gap:6px"><div class="over">Your 50/30/20 split</div><button class="iconbtn" data-act="how" aria-expanded="false" aria-label="How it works" style="width:28px;height:28px;background:none;color:var(--ink-500)">${ic('info')}</button></div><div class="vt" role="group" aria-label="Chart view" style="--i:${vi}">${VIEWS.map(([v,i,l])=>`<button data-act="view" data-v="${v}" aria-pressed="${S.variant===v}" aria-label="${l} view" title="${l}">${ic(i)}</button>`).join('')}</div></div><div class="cap" data-how hidden style="color:var(--ink-400)">Half of your take-home covers needs, 30% is for wants, and 20% is saved first. If your city makes needs more expensive, BajetJe tells you.</div>`;
  return `<div class="section split">${head}<div class="split-body">${splitBody(c)}</div></div>`;
}
/* Same container for every view; only the body changes */
function splitBody(c){
  const B = [['Needs','var(--ink-400)',c.needs,50,'Rent, food, transport, bills, PTPTN'],['Wants','var(--amber)',c.wants,30,'Eating out, shopping, hobbies'],['Savings','var(--lime)',c.savingsOut,20,'Emergency fund first, then goals']];
  if (S.variant==='jars') return `<div class="jars">${B.map(([n,col,v,p],i)=>`<div class="jar"><div class="glass"><i class="grow-y" style="--i:${i};height:${p/50*86}%;background:${col}"></i><span>${p}%</span></div><div class="lbl">${n}</div><div class="mono" style="font-size:15px">RM ${fmt(v)}</div></div>`).join('')}</div>
    <div class="cap">Filled to scale. Your needs jar is the biggest on purpose: it covers everything you can't skip.</div>`;
  if (S.variant==='ledger') return `<div class="ledger">${B.map(([n,col,v,p,d],i)=>`<div class="grow-r" style="--i:${i}"><div class="row" style="gap:8px"><span class="sw" style="background:${col}"></span><span class="lbl">${n}</span><span class="cap">${p}%</span></div><div class="cap" style="text-align:right">≈ RM ${fmt(v/c.days)}/day</div><div class="big">RM ${fmt(v)}</div><div></div><div class="cap" style="grid-column:1/-1">${d}</div></div>`).join('')}</div>`;
  return `<div class="row" style="gap:3px;height:32px">${B.map(([n,col,v,p],i)=>`<div class="grow-x" style="--i:${i};flex:${p};height:100%;background:${col};border-radius:6px;display:flex;align-items:center;padding-left:10px;transform-origin:left"><span class="lbl" style="color:var(--ink-900)">${p}%</span></div>`).join('')}</div>
    <div class="list" style="gap:14px">${B.map(([n,col,v,p,d])=>`<div class="row" style="align-items:flex-start;gap:12px"><span class="sw" style="background:${col};width:10px;height:10px;margin-top:6px"></span><div class="grow"><div class="lbl" style="font-size:15px">${n}</div><div class="cap">${d}</div></div><div class="mono" style="font-size:15px">RM ${fmt(v)}</div></div>`).join('')}</div>`;
}
function rPlan(el){
  const c = calc(); const has = c.commit > 0; const [vName, vCol] = verdict(c.ratio, 50, 65);
  const strip = Array.from({length:c.days},(_,i)=>`<i class="${i+1<c.today?'':i+1===c.today?'t today':'f'}"></i>`).join('');
  const kl = c.needs < 1930;
  const carSafe = carLimit(c.net, .20), rent = c.net*.30;
  el.innerHTML = `<div class="stack">
    <div class="row" data-r style="--i:0"><div class="grow"><div class="h2">Hey there!</div><div class="body">Pay cycle ${fmtD(c.cy.prev)} to ${fmtD(new Date(c.cy.next-DAY))} · ${c.daysLeft} day${c.daysLeft===1?'':'s'} to payday</div></div>${LANG_SWITCH()}</div>
    <div class="card" data-r style="--i:1;flex-direction:row;align-items:center;padding:14px 12px 14px 16px">
      <div class="grow"><div class="over">Take-home pay</div><div class="row" style="align-items:baseline;gap:4px"><span class="mono" style="font-size:20px;font-weight:500">RM ${fmt(c.net)}</span><span class="body">/ month</span></div><div class="cap">${S.mode==='gross'?'After EPF, SOCSO, EIS and tax':'Entered as take-home'}</div></div>
      <button class="btn btn-quiet" style="width:auto;min-height:44px;padding:0 16px;border-radius:999px;gap:6px" data-act="edit">${ic('pen')}Edit</button>
    </div>
    <div class="section" style="gap:6px">
      <div class="over" data-r style="--i:2">${has?'After bills and savings, you can spend':'You can spend'}</div>
      <div class="row" data-r style="--i:2;align-items:baseline;gap:10px"><span class="hero lime"><span class="roll" id="dailyRoll"></span></span><span class="h2">a day</span></div>
      <span class="react" data-r style="--i:3">${ic('sparkle')}<span>${c.daily>=100?'Whoa, living large!':c.daily>=40?'Plenty to go around!':c.daily>=20?'Nice and steady.':'Tight, but doable.'}</span></span>
      <div class="row body" data-r style="--i:3"><span class="sw" style="background:var(--amber);border-radius:99px"></span>${has?`RM ${fmt(c.left)} this month for food, fun and personal stuff`:`From your 30% wants: RM ${fmt(c.wants)} ÷ ${c.days} days`}</div>
      <div class="strip" data-r style="--i:4">${strip}<span class="tl" style="left:${(c.today-.5)/c.days*100}%">Today</span></div>
      <div class="row between cap" data-r style="--i:4"><span>Paid ${fmtD(c.cy.prev)}</span><span>Next payday ${fmtD(c.cy.next)}</span></div>
      <div class="row tipwrap" data-r style="--i:5;padding-top:6px;flex-wrap:wrap"><button class="chip" data-act="tip" data-tip="week" aria-expanded="false"><b>RM ${fmt(c.daily*7)}</b> a week ${ic('info')}</button><button class="chip" data-act="tip" data-tip="left" aria-expanded="false"><b>RM ${fmt(c.daily*c.daysLeft)}</b> budget till payday ${ic('info')}</button><div class="tip" id="tip" role="dialog" hidden></div></div>
    </div>
    <div data-r style="--i:6" id="split">${splitCard(c)}</div>
    ${kl?`<div data-r style="--i:7;background:rgba(255,187,51,.12);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px"><div class="lbl amber">Needs may run short in KL</div><div class="cap" style="color:var(--ink-400)">EPF's Belanjawanku guide puts a single person's basics in Klang Valley at about RM 1,930. Your 50% is RM ${fmt(c.needs)}.</div><button class="link" data-act="commit" style="align-self:flex-start">Check my commitments →</button></div>`:''}
    ${has ? `<div class="card" data-r style="--i:8">
        <div class="row between"><div class="over">Commitment health</div><span class="pill" style="background:var(--${vCol});color:var(--ink-900)">${vName}</span></div>
        <div class="row" style="align-items:baseline;gap:6px"><span class="mono" style="font-size:20px;font-weight:500">${pct(c.ratio)}</span><span class="cap">of take-home · RM ${fmt(c.commit)} a month</span></div>
        ${gauge(c.ratio,[50,65,100],100,false)}
        <div class="row between"><span class="cap" style="color:var(--ink-400)">${c.needsC<=c.needs?`RM ${fmt(c.needs-c.needsC)} left in your needs budget`:`Needs over by RM ${fmt(c.needsC-c.needs)}`}</span><button class="link" data-act="health">Details →</button></div>
      </div>` : `<div class="card" data-r style="--i:8">
        <div class="over">Commitment health</div>
        <div class="h3">Want to check if your commitment is healthy?</div>
        <div class="body">List your fixed monthly commitments. We check them against your 50% needs budget of RM ${fmt(c.needs)}.</div>
        ${ILLU}
        <button class="btn btn-primary" data-act="commit">Add my commitments</button>
      </div>`}
    <div class="section" data-r style="--i:9;gap:12px">
      <div class="over">What can I afford?</div>
      <div class="row" style="gap:12px;align-items:stretch">
        ${tile('car','Car','Comfortable up to', carSafe? 'RM '+k(carSafe):'Not yet','', `RM ${fmt(c.net*.2)}/mo all-in`, .2, 'See cars','car')}
        ${tile('home','Home','Rent up to','RM '+fmt(rent),'/mo','30% of take-home',.3,'See housing','house')}
      </div>
    </div>
    <div class="cap" style="text-align:center;font-size:11px;padding:4px 12px 0">Estimates only, based on EPF, PERKESO, LHDN and Belanjawanku guidelines. BajetJe is not a licensed financial adviser.</div>
    <button class="link" data-act="wipe" style="align-self:center;color:var(--ink-500);font-size:12px">${ic('trash')}<span> Delete all my data from this phone</span></button>
  </div>`;
  const dr = $('#dailyRoll', el); dr._prev = null; roll(dr, 'RM '+fmt(Math.max(0,c.daily)), 'end');
  if (!revealed){ const st=el.firstElementChild; st.classList.add('reveal'); revealed = true; setTimeout(()=>st.classList.remove('reveal'), 1400); }
}
const tile = (icon,title,pre,val,unit,meta,share,cta,act) => `<button class="card" data-act="${act}" style="flex:1;padding:16px;gap:10px;text-align:left;transition:transform 120ms var(--ease)" onpointerdown="this.style.transform='scale(.97)'" onpointerup="this.style.transform=''" onpointerleave="this.style.transform=''">
  <div class="row" style="gap:10px"><span class="ico">${ic(icon)}</span><span class="lbl" style="font-size:15px">${title}</span></div>
  <div><div class="cap">${pre}</div><div class="row" style="align-items:baseline;gap:3px"><span class="mono" style="font-size:20px;font-weight:500">${val}</span><span class="cap">${unit}</span></div></div>
  <div class="track" style="height:6px"><i style="width:${share*100}%;background:var(--lime)"></i></div>
  <div class="cap" style="color:var(--ink-400)">${meta}</div>
  <span class="lbl">${cta} →</span></button>`;
function gauge(p, stops, max, sweep, marks){
  const [a,b] = stops; const W = x => x/max*100;
  return `<div style="position:relative;padding:5px 0">
    <div class="zones"><i style="width:${W(a)}%;background:var(--lime)"></i><i style="width:${W(b-a)}%;background:var(--amber)"></i><i style="flex:1;background:var(--coral)"></i></div>
    <div class="marker ${sweep?'sweep':''}"><b style="--p:${Math.min(p,max)/max*100}%"></b></div>
  </div>
  <div class="row between cap"><span class="lime">Healthy ≤ ${a}%</span><span class="amber">Caution ${a} to ${b}%</span><span class="coral">High > ${b}%</span></div>`;
}

/* ================= F3 · Commitments ================= */
let editMode = false;
const esc = t => String(t).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function rCommit(el){
  el.innerHTML = `<div class="stack" style="min-height:100%">
    ${navbar('My commitments', `<button class="link" data-act="editMode" style="color:var(--ink-300)">${editMode?'Done':'Edit'}</button>`)}
    <div class="section" style="gap:6px"><div class="h1">What do you pay every month?</div><div class="body">Fixed amounts only, grouped by your 50/30/20 split. Swipe left on a row to delete it.</div><button class="link" data-act="example" style="align-self:flex-start;color:var(--ink-400)">Fill with an example</button></div>
    ${BUCKETS.map(bucketHTML).join('')}
    <div class="grow"></div>
    <div class="sticky" style="border-top:1px solid var(--ink-800)">
      <div class="row"><div class="grow"><div class="lbl soft">Fixed commitments</div><div class="cap" id="cshare"></div></div><div class="mono" style="font-size:20px;font-weight:500">RM&nbsp;<span class="roll" id="ctotal"></span></div></div>
      <div class="track"><i id="cbar" style="background:var(--lime);transition:transform 250ms var(--ease);width:100%;transform:scaleX(0)"></i><span style="position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--ink-50)"></span></div>
      <button class="btn btn-primary" id="toHealth" data-act="health">Check my commitment health</button>
    </div></div>`;
  const ct = $('#ctotal', el); ct._prev = null; updTotal(el, false);
  if (!el._swipe){ bindSwipe(el); el._swipe = true; }
  el.oninput = e => {
    const inp = e.target.closest('input[data-id]'); if (!inp) return;
    const c = S.commitments.find(x=>x.id===inp.dataset.id);
    if (inp.dataset.f==='name'){ c.name = inp.value.slice(0,28); save(); return; }
    const raw = inp.value.replace(/\D/g,'').replace(/^0+/,'').slice(0,6); c.amt = +raw||0; inp.value = raw ? fmt(+raw) : ''; save();
    clearTimeout(el._t); el._t = setTimeout(()=>updTotal(el,true),150);
  };
}
function bucketHTML([key,label,col,share,hint]){
  const items = S.commitments.filter(x=>x.bucket===key);
  return `<section class="section" data-bucket="${key}" style="gap:10px">
    <div class="row between"><div class="row" style="gap:8px"><span class="sw" style="background:${col};width:10px;height:10px"></span><span class="h3">${label}</span><span class="cap">${share*100}%</span></div><span class="mono cap" data-used style="color:var(--ink-300)"></span></div>
    <div class="track"><i data-fill style="width:100%;transform-origin:left;transform:scaleX(0);transition:transform 250ms var(--ease),background 150ms;background:${col}"></i></div>
    <div class="cap" data-note>${hint}</div>
    <div class="list">${items.map(rowHTML).join('')}<button class="item add" data-act="addRow" data-b="${key}">+ Add to ${label.toLowerCase()}</button></div>
    <div class="row" style="flex-wrap:wrap;gap:6px">${QUICK[key].map((q,i)=>`<button class="chip" data-act="quick" data-b="${key}" data-i="${i}" style="min-height:36px">+ ${q.name}</button>`).join('')}</div>
  </section>`;
}
const rowHTML = c => `<div class="swipe" data-row="${c.id}">
  <button class="sw-del" data-act="del" data-id="${c.id}" aria-label="Delete ${esc(c.name||'commitment')}">Delete</button>
  <div class="item sw-fg" data-fg="${c.id}">
    ${editMode?`<button class="minus" data-act="reveal" data-id="${c.id}" aria-label="Show delete for ${esc(c.name||'commitment')}"><i></i></button>`:''}
    <span class="ico">${ic(c.icon)}</span>

/* iOS-style swipe to delete: horizontal drag reveals Delete; vertical drag scrolls */
function bindSwipe(root){
  let fg=null, x0=0, y0=0, base=0, x=0, decided=false, drag=false;
  const W = 84, closeAll = except => root.querySelectorAll('.sw-fg.open').forEach(f=>{ if (f!==except){ f.classList.remove('open'); f.style.transform=''; } });
  root.addEventListener('pointerdown', e => { if (e.target.closest('.sw-del')) return; const f = e.target.closest('.sw-fg'); if (!f) { closeAll(); return; } fg=f; x0=e.clientX; y0=e.clientY; base = f.classList.contains('open') ? -W : 0; x=base; decided=false; drag=false; });
  root.addEventListener('pointermove', e => {
    if (!fg) return; const dx=e.clientX-x0, dy=e.clientY-y0;
    if (!decided){ if (Math.abs(dx)<6 && Math.abs(dy)<6) return; decided=true; drag=Math.abs(dx)>Math.abs(dy); if (drag){ try{fg.setPointerCapture(e.pointerId);}catch(_){} closeAll(fg); } }
    if (!drag) return;
    x = base + dx; if (x>0) x = x*0.2; if (x<-W) x = -W + (x+W)*0.3;
    fg.style.transition='none'; fg.style.transform=`translateX(${x}px)`;
  });
  const end = () => { if (!fg) return; if (drag){ const open = x < -W/2; fg.style.transition=''; fg.style.transform = open?`translateX(-${W}px)`:''; fg.classList.toggle('open', open); if (document.activeElement && fg.contains(document.activeElement)) document.activeElement.blur(); } fg=null; };
  root.addEventListener('pointerup', end); root.addEventListener('pointercancel', end);
}
function toast(msg, undo){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t = document.createElement('div'); t.className='toast'; t.setAttribute('role','status');
  t.innerHTML = `<span class="grow">${esc(msg)}</span><button class="link" style="color:var(--lime);padding:10px;margin:-10px 0">Undo</button>`;
  t.querySelector('button').onclick = () => { t.remove(); undo(); };
  app.appendChild(t); setTimeout(()=>t.remove(), 4000);
}

      ${S.homeDown===0?'':`<div class="section"><div class="over">Saving for the down payment</div>
        <div class="row" style="align-items:baseline;gap:6px"><span class="mono" style="font-size:20px;font-weight:500">${h.months===Infinity?'n/a':h.months<12?h.months+' months':'~'+Math.round(h.months/12*10)/10+' years'}</span><span class="cap">at RM ${fmt(c.savingsOut)} a month</span></div>
        <div class="row" style="gap:4px">${Array.from({length:Math.min(5,Math.ceil(h.months/12))},(_,i)=>{const f=Math.min(1,Math.max(0,(h.months-i*12)/12));return `<div class="grow" style="display:flex;flex-direction:column;gap:6px"><div class="track"><i class="grow-x" style="width:${f*100}%;background:var(--ink-300)"></i></div><span class="cap">Year ${i+1}</span></div>`}).join('')}</div></div>`}
      ${c.commit?`<div class="section"><div class="row between"><div class="over">If you buy at this price</div><span class="pill" style="background:var(--${verdict(afterPct,50,65)[1]});color:var(--ink-900)">${verdict(afterPct,50,65)[0]}</span></div>
        ${bars('Commitments',[['Now',c.ratio,'var(--ink-600)',pct(c.ratio)],['After',afterPct,'var(--'+verdict(afterPct,50,65)[1]+')',pct(afterPct)]])}
        <div class="cap" style="color:var(--ink-400)">Instalment replaces your current rent of RM ${fmt(cur)}.</div></div>`:''}`}
    <div class="cap" style="text-align:center;font-size:11px">Estimates only. Bank approval, rates and fees vary. Not financial advice.</div>
  </div>`;
}

/* ================= Events ================= */
/* Motion for every control: thumbs slide from where they were, selected chips pop, toggles glide */
function motionAfter(act, v, k, from){
  const scr = document.querySelector('.screen.active'); if (!scr) return;
  const sel = `[data-act="${act}"]${v!==undefined?`[data-v="${v}"]`:''}${k?`[data-k="${k}"]`:''}`;
  const el = scr.querySelector(sel); if (!el) return;
  const thumb = act==='swap' ? el : el.closest('.seg,.lang');
  if (thumb && from!=null){ const to = thumb.style.getPropertyValue('--i'); if (String(from)!==to){ thumb.style.transition='none'; thumb.style.setProperty('--i', from); void thumb.offsetWidth; thumb.style.transition=''; requestAnimationFrame(()=>thumb.style.setProperty('--i', to)); } }
  if (el.classList.contains('chip')){ el.classList.remove('just'); void el.offsetWidth; el.classList.add('just'); }
}
app.addEventListener('click', e => {
  { const t=e.target.closest('[data-act]'); if (t){ const act=t.dataset.act, v=t.dataset.v, k=t.dataset.k; let from=null;
    const grp=t.closest('.seg,.lang'); if (grp) from=grp.style.getPropertyValue('--i'); if (act==='swap') from=t.style.getPropertyValue('--i');
    if (['mode','home','lang','payday','cardown','homedown','rate','elig','swap','carq'].includes(act)) queueMicrotask(()=>motionAfter(act, act==='swap'?undefined:v, k, from)); } }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a==='lang'){ const v=b.dataset.v; if (v===S.lang) return; S.lang=v; save(); document.documentElement.lang = v==='ms'?'ms':'en'; const cur=stack[stack.length-1]||'welcome'; const sc=screens[cur].scrollTop; revealed=true; render(cur); screens[cur].scrollTop=sc; return; }
  if (a==='swap'){ S.carSwap=!S.carSwap; save(); const sc=screens.car.scrollTop; render('car'); screens.car.scrollTop=sc; return; }
  if (a==='back') return back();
  if (a==='start'){ S.welcomed=true; save(); stack=[]; return go('salary','fwd'); }
  if (a==='mode'){ S.mode=b.dataset.v; save(); return render('salary'); }
  if (a==='payday'){ S.payday=b.dataset.v; save(); return render('salary'); }
  if (a==='sample'){ S.raw='3500'; save(); render('salary'); const sr=$('#salRoll'); if(sr){sr._prev=new Map(); roll(sr,'3,500','start');} return; }
  if (a==='toPlan'){ if (b.classList.contains('loading')) return; const ms=S.lang==='ms', net=calc().net;
    const msg = noteFor(net, ms);
    b.classList.add('loading'); b.innerHTML = `<svg class="spin" viewBox="0 0 24 24" aria-hidden="true">${SPIN}</svg><span>${ms?'Kira jap...':'Crunching...'}</span>`;
    const n=b.parentElement.querySelector('.note'); n.querySelector('span').textContent=msg; n.hidden=false; n.classList.add('show');
    const reduce=!!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
    setTimeout(()=>{ stack=[]; go('plan','fwd'); }, reduce?500:1300); return; }
  if (a==='edit') return go('salary','fwd');
  if (a==='commit') return go('commit','fwd');
  if (a==='health') return go('health','fwd');
  if (a==='car') return go('car','fwd');
  if (a==='house') return go('house','fwd');
  if (a==='carq'){ const r=screens.car.querySelector('#price'); r.value=b.dataset.v; r.dispatchEvent(new Event('input')); return; }
  if (a==='tip'){ const tip=screens.plan.querySelector('#tip'); const open = b.getAttribute('aria-expanded')==='true';
    screens.plan.querySelectorAll('[data-act=tip]').forEach(x=>x.setAttribute('aria-expanded','false'));
    if (open){ tip.hidden=true; return; }
    tip.innerHTML = tipHTML(b.dataset.tip, calc()); tip.style.setProperty('--ax', (b.offsetLeft + 24)+'px'); tip.hidden=false; tip.style.animation='none'; void tip.offsetWidth; tip.style.animation='';
    b.setAttribute('aria-expanded','true'); return; }
  if (a==='toPlanBack'){ stack=['plan']; return go('plan','back'); }
  if (a==='how'){ const t=b.closest('#split').querySelector('[data-how]'); t.hidden=!t.hidden; b.setAttribute('aria-expanded', String(!t.hidden)); return; }
  if (a==='example'){ PRESETS.forEach((p,i)=>{ let c=S.commitments.find(x=>x.name===p.name); if(!c){ c={id:'c'+Date.now()+i, ...p, amt:0}; S.commitments.push(c); } c.amt=p.ex; c.bucket=p.bucket; }); save(); return rerenderCommit(); }
  if (a==='addRow'||a==='quick'){ const bk=b.dataset.b; const q = a==='quick'? QUICK[bk][+b.dataset.i] : {icon:'card',name:'',cat:'Other',debt:false}; const id='c'+Date.now(); S.commitments.push({id, ...q, bucket:bk, amt:0, custom:a==='addRow'}); save(); rerenderCommit(); const row=screens.commit.querySelector(`[data-row="${id}"]`); row.style.animation='rise 250ms var(--ease) both'; row.querySelector(a==='addRow'?'input[data-f="name"]':'.amt input')?.focus({preventScroll:true}); return; }
  if (a==='editMode'){ editMode=!editMode; return rerenderCommit(); }
  if (a==='reveal'){ const f=screens.commit.querySelector(`[data-fg="${b.dataset.id}"]`); const open=!f.classList.contains('open'); screens.commit.querySelectorAll('.sw-fg.open').forEach(x=>{x.classList.remove('open');x.style.transform='';}); if(open){ f.classList.add('open'); f.style.transform='translateX(-84px)'; } return; }
  if (a==='del'){ const id=b.dataset.id, idx=S.commitments.findIndex(c=>c.id===id), item=S.commitments[idx]; const row=screens.commit.querySelector(`[data-row="${id}"]`);
    row.style.height=row.offsetHeight+'px'; void row.offsetHeight; row.style.transition='height 220ms var(--ease), opacity 160ms ease, margin 220ms var(--ease)'; row.style.height='0px'; row.style.opacity='0'; row.style.marginTop='-8px';
    setTimeout(()=>{ S.commitments.splice(idx,1); save(); rerenderCommit(); toast(`Deleted ${item.name||'commitment'}`, ()=>{ S.commitments.splice(Math.min(idx,S.commitments.length),0,item); save(); rerenderCommit(); }); }, 220); return; }
  if (a==='view'){ const v=b.dataset.v; if (v===S.variant) return; S.variant=v; save();
    const wrap=screens.plan.querySelector('#split'), vt=wrap.querySelector('.vt'), body=wrap.querySelector('.split-body');
    vt.style.setProperty('--i', VIEWS.findIndex(x=>x[0]===v)); vt.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x.dataset.v===v));
    const h0=body.offsetHeight; body.innerHTML=splitBody(calc()); const h1=body.offsetHeight;
    body.classList.remove('swap'); void body.offsetWidth; body.classList.add('swap');
    if (body.animate && !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) body.animate([{height:h0+'px'},{height:h1+'px'}],{duration:260,easing:'cubic-bezier(0.23,1,0.32,1)'});
    return; }
  if (a==='wipe'){ if (b.dataset.armed){ S=fresh(); save(); revealed=false; Object.values(screens).forEach(x=>x.remove()); for (const k in screens) delete screens[k]; stack=[]; return go('welcome','fwd'); } b.dataset.armed='1'; b.style.color='var(--coral)'; b.lastChild.textContent=' Tap again to delete everything'; setTimeout(()=>{ if(b.isConnected){ delete b.dataset.armed; b.style.color='var(--ink-500)'; b.lastChild.textContent=' Delete all my data from this phone'; } }, 3000); return; }

  if (a==='home'){ S.home=b.dataset.v; save(); return render('house'); }
  if (a==='rate'){ S.rate=+b.dataset.v; save(); return render('house'); }
  if (a==='cardown'){ S.carDown=+b.dataset.v; save(); return render('car'); }
  if (a==='homedown'){ const v=+b.dataset.v; if (v===0){ S.eligOpen=true; if (eligibility().state==='yes') S.homeDown=0; } else { S.homeDown=v; S.eligOpen=false; } save(); return render('house'); }
  if (a==='elig'){ S.elig[b.dataset.k] = b.dataset.v==='true'; const r=eligibility(); S.homeDown = r.state==='yes' ? 0 : (S.homeDown===0 ? 0.1 : S.homeDown); save(); const sc=screens.house.scrollTop; render('house'); screens.house.scrollTop=sc; return; }
  if (a==='eligClose'){ S.eligOpen=false; save(); const sc=screens.house.scrollTop; render('house'); screens.house.scrollTop=sc; return; }
});
document.addEventListener('click', e => { if (e.target.closest('[data-act=tip]') || e.target.closest('#tip')) return; closeTip(); });
document.addEventListener('keydown', e => { if (e.key==='Escape') closeTip(); });
function closeTip(){ const t=screens.plan && screens.plan.querySelector('#tip'); if (t && !t.hidden){ t.hidden=true; screens.plan.querySelectorAll('[data-act=tip]').forEach(x=>x.setAttribute('aria-expanded','false')); } }
function tipHTML(kind, c){
  const src = c.commit ? ['Left after bills and savings', c.left] : ['30% wants', c.wants];
  const n = kind==='week' ? 7 : c.daysLeft;
  return `<div class="lbl">${kind==='week' ? 'Your spending budget for 7 days' : 'Your spending budget until payday'}</div>
    <div class="eq"><span>${src[0]}</span><b>RM ${fmt(src[1])}</b><span>÷ days in this pay cycle</span><b>${c.days}</b><span>= Daily budget</span><b>RM ${fmt(c.daily)}</b><span>× ${kind==='week'?'7 days':'days left till payday'}</span><b>${n}</b><span class="tot">${kind==='week'?'Weekly budget':'Budget till payday'}</span><b class="tot">RM ${fmt(c.daily*n)}</b></div>
    <div class="cap" style="color:var(--ink-400)">A plan, not your bank balance. BajetJe doesn't track spending, so this assumes you keep to RM ${fmt(c.daily)} a day.</div>`;
}
app.addEventListener('change', e => { if (e.target.matches('[data-act="payOther"]') && e.target.value){ S.payday=e.target.value; save(); render('salary'); } });

/* Splash: plays once per launch, tap to skip */
(() => { const sp = document.getElementById('splash'); if (!sp) return; const reduce = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const done = () => { if (sp.classList.contains('out')) return; sp.classList.add('out'); setTimeout(()=>sp.remove(), 320); };
  sp.addEventListener('click', done); setTimeout(done, reduce ? 800 : 1600); })();
/* Test hook for the build team: exposes the pure engine (no UI) */
window.__bajetje = { payroll, cycle, calc, carAllIn, carLimit, home, eligibility, state: () => S, set: o => Object.assign(S, o) };
go(S.raw && S.payday ? 'plan' : S.welcomed ? 'salary' : 'welcome', 'fwd');
})();
</script>
